name: Kernel build for redbull device

# PHASE 1 (main mới): CHỈ build kernel redbull (redfin/bramble) KHÔNG patch,
# để chứng minh kernel custom được và ra boot.img/vendor_boot.img/dtbo.img.
# KSU / SUSFS / modules sẽ được mod dần ở các phase sau.
# Pipeline KSU/SUSFS đầy đủ trước đây nằm ở nhánh `main-legacy`.
#
# Theo đúng flow cũ: repo sync -> chèn ramdisk gốc -> build_redbull-gki.sh -> đóng gói.

on:
  workflow_dispatch:
    inputs:
      device:
        type: choice
        description: 'Thiết bị'
        required: true
        default: 'redfin'
        options:
          - redfin
          - bramble
      android_version:
        type: choice
        description: 'Branch manifest (phải có ramdisk tương ứng trong repo)'
        required: true
        default: 'android-msm-redbull-4.19-android14'
        options:
          - android-msm-redbull-4.19-android12
          - android-msm-redbull-4.19-android13-qpr3
          - android-msm-redbull-4.19-android14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Display build
        run: |
          echo "Device: ${{ github.event.inputs.device }}"
          echo "Android/branch: ${{ github.event.inputs.android_version }}"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        run: |
          CONFIG=${{ github.event.inputs.device }}
          ANDROID_BRANCH=${{ github.event.inputs.android_version }}
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "ANDROID_BRANCH=$ANDROID_BRANCH" >> $GITHUB_ENV
          echo "RAMDISK_PATH=$GITHUB_WORKSPACE/ramdisk/$CONFIG/$ANDROID_BRANCH" >> $GITHUB_ENV

      - name: Install Repo
        run: |
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev \
            libncurses5-dev gcc-aarch64-linux-gnu make dwarves zip curl

      - name: Git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global color.ui false

      - name: 🔍 Locate ramdisk (fail nếu thiếu)
        run: |
          echo "Tìm ramdisk trong: $RAMDISK_PATH"
          if [ ! -f "$RAMDISK_PATH/ramdisk" ] || [ ! -f "$RAMDISK_PATH/vendor_ramdisk" ]; then
            echo "::error::Thiếu ramdisk/vendor_ramdisk tại $RAMDISK_PATH"
            echo "::error::Cặp device + android_version này chưa có ramdisk trong repo."
            exit 1
          fi
          echo "OK"; ls -l "$RAMDISK_PATH"

      - name: Initialize & Sync Kernel Source
        run: |
          set -e
          mkdir -p "$CONFIG"
          cp -fv "$RAMDISK_PATH/ramdisk" "$CONFIG/"
          cp -fv "$RAMDISK_PATH/vendor_ramdisk" "$CONFIG/"
          cd "$CONFIG"
          echo "repo init -b $ANDROID_BRANCH"
          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b $ANDROID_BRANCH
          $REPO --version
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          # chèn ramdisk gốc vào prebuilts để build_redbull-gki dùng
          cp -fv ramdisk prebuilts/boot-artifacts/ramdisks/ramdisk-aosp_arm64.img
          cp -fv vendor_ramdisk prebuilts/boot-artifacts/ramdisks/vendor_ramdisk-barbet.img
          cp -fv vendor_ramdisk prebuilts/boot-artifacts/ramdisks/vendor_ramdisk-redfin.img
          cp -fv vendor_ramdisk prebuilts/boot-artifacts/ramdisks/vendor_ramdisk-bramble.img

      - name: Fix build config (bỏ check_defconfig)
        run: |
          cd "$CONFIG/private/msm-google/"
          sed -i 's/check_defconfig//' ./build.config.common || true
          sed -i 's/check_defconfig//' ./build.config.redbull || true
          sed -i 's/check_defconfig && //' ./build.config.redbull.no-cfi || true

      - name: Build kernel (không patch)
        run: |
          set -e
          cd "$CONFIG"
          echo "BUILD_AOSP_KERNEL=1 ./build_redbull-gki.sh"
          BUILD_AOSP_KERNEL=1 ./build_redbull-gki.sh
          echo "== dist =="
          ls -l ./out/android-msm-pixel-4.19/dist/ || find out -maxdepth 3 -name '*.img'

      - name: Đóng gói fastboot.zip
        run: |
          set -e
          cd "$CONFIG"
          mkdir -p fastboot_files
          cp -f ./out/android-msm-pixel-4.19/dist/boot.img fastboot_files/
          cp -f ./out/android-msm-pixel-4.19/dist/vendor_boot.img fastboot_files/
          cp -f ./out/android-msm-pixel-4.19/dist/dtbo.img fastboot_files/
          cd fastboot_files/
          zip -r fastboot.zip .
          ls -l

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-${{ github.event.inputs.device }}-${{ github.event.inputs.android_version }}
          path: ${{ env.CONFIG }}/fastboot_files/fastboot.zip
          if-no-files-found: error
